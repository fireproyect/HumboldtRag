<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Institucional UAH - Trabajo de Grado</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Librería marked.js y DOMPurify para renderizado seguro de Markdown y Tablas -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body class="chat-page">

    <header>
        <div class="header-left">
            <h1>Asistente Institucional UAH</h1>
            <div class="status-badge" id="server-status">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Conectando motor IA...</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="secondary" onclick="limpiarChat()" style="padding: 6px 12px; font-size: 0.82rem;">Nueva Consulta</button>
            <a href="admin.html">Panel Administrador →</a>
        </div>
    </header>

    <div id="chat-container">
        <div id="chat-messages">
            <div class="message bot">
                <div class="msg-content">Hola. Soy el Asistente Institucional de la Universidad Alejandro de Humboldt. Puedes consultarme sobre normativas, documentos o imágenes indexadas en el sistema.</div>
            </div>
        </div>
        
        <div id="chat-input-area">
            <input type="text" id="user-input" placeholder="Escribe tu consulta (ej: ¿Cuál es el RIF del documento?)..." autocomplete="off">
            <button id="send-btn" onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
