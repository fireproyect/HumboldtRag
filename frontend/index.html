<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Corporativo IA - Victory Logistic</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
</head>
<body class="chat-page">

    <header>
        <div class="header-left">
            <h1>Victory Logistic · Asistente IA</h1>
            <div class="status-badge" id="server-status">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Conectando...</span>
            </div>
            <span class="user-pill" id="header-user-info" style="display: none;"></span>
        </div>
        <div class="header-actions">
            <select id="admin-dept-filter" class="header-select" style="display: none;" title="Filtrar consultas por departamento">
                <option value="Todos">Todos los Departamentos</option>
                <option value="Dispatch">Dispatch</option>
                <option value="Managment">Managment</option>
                <option value="Track and Trace">Track and Trace</option>
                <option value="ELD">ELD</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Human Resources">Human Resources</option>
                <option value="Recruitment">Recruitment</option>
                <option value="Accounting">Accounting</option>
                <option value="General">General</option>
            </select>

            <button class="theme-toggle" id="theme-btn" onclick="alternarTema()" title="Cambiar modo claro/oscuro">🌙</button>
            <button id="btn-nueva-consulta" class="secondary" onclick="limpiarChat()" style="display: none; padding: 5px 11px; font-size: 0.82rem;">Nueva Consulta</button>
            <a id="link-admin" href="admin.html" style="display: none;">Panel Admin →</a>
            <button id="btn-logout" class="danger" onclick="cerrarSesion()" style="display: none; padding: 5px 11px; font-size: 0.82rem;">Salir</button>
        </div>
    </header>

    <!-- PANTALLA DE LOGIN / REGISTRO -->
    <div id="auth-screen" class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="tab-login" onclick="mostrarTabAuth('login')">Iniciar Sesión</button>
                <button type="button" class="auth-tab" id="tab-register" onclick="mostrarTabAuth('register')">Registrarse</button>
            </div>

            <!-- Formulario Login -->
            <form id="form-login" onsubmit="event.preventDefault(); iniciarSesionUsuario();" autocomplete="on">
                <div class="form-group">
                    <label>Usuario o Correo Corporativo</label>
                    <input type="text" id="login-username" name="username" autocomplete="username" class="form-control" placeholder="ej: jperez o admin">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" name="password" autocomplete="current-password" class="form-control" placeholder="••••••••">
                </div>
                <button type="submit" id="btn-login-submit" style="width: 100%; margin-top: 6px;">Entrar al Sistema</button>
            </form>

            <!-- Formulario Registro -->
            <form id="form-register" onsubmit="event.preventDefault(); registrarNuevoUsuario();" style="display: none;" autocomplete="off">
                <div class="form-group">
                    <label>Nombre y Apellido</label>
                    <input type="text" id="reg-nombre" autocomplete="off" class="form-control" placeholder="ej: Juan Pérez">
                </div>
                <div class="form-group">
                    <label>Usuario o Correo Corporativo</label>
                    <input type="text" id="reg-username" autocomplete="off" class="form-control" placeholder="ej: jperez@victorylogistic.com">
                </div>
                <div class="form-group">
                    <label>Departamento</label>
                    <select id="reg-departamento" class="form-control">
                        <option value="">-- Selecciona tu departamento --</option>
                        <option value="Dispatch">Dispatch</option>
                        <option value="Managment">Managment</option>
                        <option value="Track and Trace">Track and Trace</option>
                        <option value="ELD">ELD</option>
                        <option value="Maintenance">Maintenance</option>
                        <option value="Human Resources">Human Resources</option>
                        <option value="Recruitment">Recruitment</option>
                        <option value="Accounting">Accounting</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="reg-password" autocomplete="new-password" class="form-control" placeholder="Mínimo 4 caracteres">
                </div>
                <button type="submit" id="btn-reg-submit" style="width: 100%; margin-top: 6px;">Crear Cuenta</button>
            </form>

            <p id="auth-message" style="color: #ef4444; font-size: 0.85rem; margin-top: 12px; text-align: center;"></p>
        </div>
    </div>

    <!-- CONTENEDOR DEL CHAT -->
    <div id="chat-container" style="display: none;">
        <div id="chat-messages"></div>
        
        <div id="chat-input-area">
            <input type="search" id="user-input" name="chat_query_field" placeholder="Escribe tu consulta para Victory Logistic..." autocomplete="off" autocorrect="off" spellcheck="false" data-lpignore="true">
            <button type="button" id="send-btn" onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
