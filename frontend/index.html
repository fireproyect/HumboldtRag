<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Corporativo - Victory Logistic</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Librerías de Markdown, Seguridad XSS, Gráficos y Diagramas -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
</head>
<body class="chat-page">

    <header>
        <div class="header-left">
            <h1>Victory Logistic · Asistente IA</h1>
            <div class="status-badge" id="server-status">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Conectando motor IA...</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="theme-toggle" id="theme-btn" onclick="alternarTema()" title="Cambiar modo claro/oscuro">🌙</button>
            <button class="secondary" onclick="limpiarChat()" style="padding: 6px 12px; font-size: 0.82rem;">Nueva Consulta</button>
            <a href="admin.html">Administración →</a>
        </div>
    </header>

    <div id="chat-container">
        <div id="chat-messages">
            <div class="message bot">
                <div class="msg-content">Hola. Soy el asistente corporativo de <strong>Victory Logistic</strong>. Puedes consultarme sobre documentos operativos, normativas, reportes o imágenes indexadas en nuestra base de conocimiento.</div>
            </div>
        </div>
        
        <div id="chat-input-area">
            <input type="text" id="user-input" placeholder="Escribe tu consulta para Victory Logistic..." autocomplete="off">
            <button id="send-btn" onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
